<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Canvas Flow AI | AI Design Studio</title>

  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #070b10;
      color: white;
    }

    .app {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      margin-bottom: 10px;
      font-size: 16px;
      outline: none;
    }

    .format-row {
      display: flex;
      gap: 10px;
      margin: 10px 0;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      background: #1f6fff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #3a86ff;
    }

    #output {
      margin-top: 20px;
      display: grid;
      gap: 20px;
    }

    .card {
      background: #111827;
      padding: 20px;
      border-radius: 12px;
    }

    .meta-post {
      border-left: 4px solid #3a86ff;
    }

    .youtube-thumb {
      border-left: 4px solid #ff0033;
    }

    .admin-box {
      margin-top: 30px;
      padding: 15px;
      background: #111827;
      border-radius: 12px;
    }
  </style>

</head>

<body>

<div class="app">

  <h1>Canvas Flow AI</h1>
  <p>AI Design Studio</p>

  <div class="format-row">
    <button id="metaBtn">Meta Feed Post</button>
    <button id="youtubeBtn">YouTube Thumbnail</button>
    <button id="instagramBtn">Instagram Post</button>
    <button id="tiktokBtn">TikTok Concept</button>
    <button id="allBtn">All Platforms</button>
  </div>

  <button id="generateBtn">Generate</button>

<div class="prompt-box">

  <label for="prompt">
    What do you want to create?
  </label>

  <textarea
    id="prompt"
    placeholder="Describe your creative idea..."
  ></textarea>

  <button onclick="generate()">
    Generate
  </button>

</div>
  
  <div id="output"></div>


  <div class="admin-box">
    <h3>Admin Unlock</h3>
    <input id="adminCode" type="password" placeholder="Enter admin code">
    <button id="unlockBtn">Unlock</button>
    <p id="adminStatus"></p>
  </div>


</div>


<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {

  navigator.serviceWorker.register("sw.js")
    .then(() => console.log("Service Worker Registered"))
    .catch(err => console.log(err));

}
</script>


</body>
</html>
